# Warrant Book analyzer configuration — strict by design.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/app/build/**
    - ios/Flutter/ephemeral/**
    - lib/l10n/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat missing returns and dead code as errors to keep the codebase tight.
    dead_code: error
    unused_import: error
    unused_local_variable: error
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - test_types_in_equals
    - throw_in_finally
    - type_annotate_public_apis
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_string_buffers
